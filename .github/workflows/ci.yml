name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests alembic scripts
      - name: Format check (ruff)
        run: ruff format --check app tests alembic scripts
      - name: Type check (mypy)
        run: mypy app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: eval
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://eval:eval@localhost:5432/eval
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Run tests with coverage
        run: >-
          pytest
          --cov=app/graders --cov=app/workers --cov=app/api
          --cov-report=term-missing
          --cov-fail-under=80
