services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: eval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d eval"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://eval:eval@postgres:5432/eval
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"
    volumes:
      - .:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.worker:celery_app worker --loglevel=info
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://eval:eval@postgres:5432/eval
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
